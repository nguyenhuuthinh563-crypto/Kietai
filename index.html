<head>

<title>Kiệt – Hỏi đáp Hệ Mặt Trời</title>
<style>
:root{--bg:#0e1330;--panel:#171d44;--line:#2c3566;--tx:#e9ecff;--mut:#9aa3d6;--sun:#ffb547;--tea:#5fd4c4;--err:#ff8a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:24px;align-items:start}
@media(max-width:720px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:1.5rem;font-weight:700}
h1 small{display:block;font-size:.9rem;font-weight:400;color:var(--mut)}
.stage{position:relative;aspect-ratio:1/1.1;border-radius:50% 50% 24px 24px/40% 40% 24px 24px;background:radial-gradient(circle at 50% 38%,#26307a,#121743 70%);border:1px solid var(--line);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.ring{position:absolute;left:50%;top:38%;border:1px dashed rgba(255,255,255,.12);border-radius:50%;transform:translate(-50%,-50%)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
#ans{min-height:150px;font-size:1.08rem;white-space:pre-wrap;max-width:68ch}
#ans.err{color:var(--err);font:14px/1.5 Consolas,monospace}
.row{display:flex;gap:8px;margin-top:14px}
input[type=text]{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1030;color:var(--tx);font:inherit}
button,select{font:inherit;color:var(--tx)}
button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--sun);color:#2a1a00;font-weight:600}
button.sec{background:#222a5c;color:var(--tx)}
button.on{background:var(--tea);color:#00221e}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--tea);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:400;padding:6px 12px;font-size:.9rem}
.chips button:hover{border-color:var(--sun);color:var(--tx)}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;color:var(--mut);font-size:.9rem}
select{background:#0c1030;border:1px solid var(--line);border-radius:8px;padding:6px;max-width:210px}
.right{display:flex;flex-direction:column;gap:14px}
.you{color:var(--mut);font-size:.9rem;min-height:1.4em}
</style>
</head>

</main>

var G=[
["kepler|3 dinh luat|ba dinh luat","Ba định luật Kepler:\n1) Quỹ đạo của hành tinh là elip, Mặt Trời ở một tiêu điểm.\n2) Đoạn thẳng nối Mặt Trời với hành tinh quét những diện tích bằng nhau trong những khoảng thời gian bằng nhau.\n3) T²/a³ là hằng số cho mọi hành tinh. Với a tính bằng AU và T tính bằng năm thì T² = a³."],
["kepler 1|dinh luat 1|dinh luat thu nhat|dinh luat quy dao","Định luật Kepler 1: mỗi hành tinh chuyển động theo một quỹ đạo elip, Mặt Trời nằm ở một tiêu điểm của elip."],
["kepler 2|dinh luat 2|dinh luat thu hai|dinh luat dien tich","Định luật Kepler 2: đoạn thẳng nối Mặt Trời với hành tinh quét những diện tích bằng nhau trong những khoảng thời gian bằng nhau. Vì vậy hành tinh chuyển động nhanh nhất ở cận nhật và chậm nhất ở viễn nhật."],
["kepler 3|dinh luat 3|dinh luat thu ba|dinh luat chu ky","Định luật Kepler 3: tỉ số T²/a³ như nhau với mọi hành tinh quay quanh Mặt Trời (T là chu kỳ, a là bán trục lớn). Với a tính bằng AU và T tính bằng năm thì T² = a³. Bạn thử hỏi: chu kỳ với a = 4 AU."],
["van vat hap dan|dinh luat hap dan|luc hap dan|newton","Định luật vạn vật hấp dẫn: lực hút giữa hai chất điểm có độ lớn F = G·m₁·m₂/r², với G = 6,67×10⁻¹¹ N·m²/kg². Lực này giữ các hành tinh quay quanh Mặt Trời."],
["van toc vu tru|toc do thoat|van toc thoat","Vận tốc vũ trụ cấp 1 là 7,9 km/s (bay quanh Trái Đất), cấp 2 là 11,2 km/s (thoát khỏi Trái Đất), cấp 3 là 16,7 km/s (thoát khỏi Hệ Mặt Trời)."],
["mat troi","Mặt Trời là ngôi sao ở trung tâm Hệ Mặt Trời, bán kính khoảng 696 000 km, khối lượng 1,99×10³⁰ kg (chiếm 99,86% khối lượng cả hệ). Nhiệt độ bề mặt khoảng 5 500°C, lõi khoảng 15 triệu K. Năng lượng đến từ phản ứng nhiệt hạch biến hiđrô thành hêli. Tuổi khoảng 4,6 tỉ năm."],
["mat trang","Mặt Trăng là vệ tinh tự nhiên của Trái Đất, cách Trái Đất khoảng 384 400 km, đường kính 3 474 km. Nó quay quanh Trái Đất mỗi 27,3 ngày, chu kỳ các pha là 29,5 ngày, và luôn hướng một mặt về phía Trái Đất."],
["sao choi","Sao chổi là khối băng, bụi và đá chuyển động theo quỹ đạo elip rất dẹt. Khi lại gần Mặt Trời, băng bay hơi tạo thành đuôi luôn hướng ra xa Mặt Trời. Sao chổi Halley có chu kỳ khoảng 76 năm."],
["tieu hanh tinh|vanh dai","Tiểu hành tinh là những thiên thể đá nhỏ, tập trung nhiều ở vành đai giữa Sao Hỏa và Sao Mộc. Ceres (đường kính khoảng 940 km) là vật lớn nhất, được xếp vào hành tinh lùn."],
["thuy trieu|trieu cuong|trieu kem","Thủy triều do lực hấp dẫn của Mặt Trăng (và một phần của Mặt Trời) lên nước biển, nên mỗi ngày có hai lần nước lên và hai lần nước xuống. Triều cường xảy ra khi Mặt Trời, Mặt Trăng và Trái Đất gần thẳng hàng (ngày trăng mới và trăng tròn)."],
["nhat thuc","Nhật thực xảy ra khi Mặt Trăng nằm giữa Mặt Trời và Trái Đất, vào ngày trăng mới, bóng Mặt Trăng đổ xuống một vùng trên Trái Đất."],
["nguyet thuc","Nguyệt thực xảy ra khi Trái Đất nằm giữa Mặt Trời và Mặt Trăng, vào đêm trăng tròn, Mặt Trăng đi vào bóng của Trái Đất. Không xảy ra mỗi tháng vì quỹ đạo Mặt Trăng nghiêng khoảng 5° so với quỹ đạo Trái Đất."],
["cac mua|mua trong nam|tai sao co mua|bon mua","Các mùa hình thành do trục quay của Trái Đất nghiêng khoảng 23,5° so với pháp tuyến của mặt phẳng quỹ đạo, không phải do khoảng cách đến Mặt Trời thay đổi."],
["nguon goc|hinh thanh|ra doi","Hệ Mặt Trời hình thành cách đây khoảng 4,6 tỉ năm từ một đám mây khí và bụi (tinh vân Mặt Trời) co lại dưới tác dụng của lực hấp dẫn. Phần lớn vật chất tụ ở giữa tạo ra Mặt Trời, phần còn lại thành đĩa quay rồi kết tụ thành các hành tinh."],
["nam anh sang","Năm ánh sáng là quãng đường ánh sáng đi trong chân không trong một năm, khoảng 9,46×10¹² km, tương đương khoảng 63 241 AU."],
["don vi thien van|1 au|au la gi|dvtv","1 AU (đơn vị thiên văn) bằng khoảng cách trung bình Trái Đất – Mặt Trời, khoảng 1,496×10⁸ km (149,6 triệu km)."],
["diem vuong|pluto","Sao Diêm Vương là hành tinh lùn từ năm 2006, cách Mặt Trời khoảng 39,5 AU, đường kính khoảng 2 377 km."],
["may hanh tinh|8 hanh tinh|tam hanh tinh|he mat troi gom|hanh tinh nao","Hệ Mặt Trời có 8 hành tinh, theo thứ tự từ trong ra ngoài: Thủy, Kim, Trái Đất, Hỏa, Mộc, Thổ, Thiên Vương, Hải Vương. Bốn hành tinh trong là hành tinh đá, bốn hành tinh ngoài là hành tinh khí và băng khổng lồ."],
["hanh tinh lun|hanh tinh lun la gi","Hành tinh lùn là thiên thể quay quanh Mặt Trời, đủ khối lượng để có dạng gần cầu nhưng chưa dọn sạch quỹ đạo của mình. Ví dụ: Diêm Vương, Ceres, Eris, Haumea, Makemake."],
["hanh tinh da|hanh tinh khi|hanh tinh khong lo|hanh tinh dang khi","Bốn hành tinh trong (Thủy, Kim, Trái Đất, Hỏa) là hành tinh đá: nhỏ, đặc, có bề mặt rắn. Sao Mộc và Sao Thổ là hành tinh khí khổng lồ (chủ yếu hiđrô, hêli); Sao Thiên Vương và Hải Vương là hành tinh băng khổng lồ."],
["hanh tinh lon nhat|hanh tinh to nhat","Hành tinh lớn nhất là Sao Mộc, đường kính khoảng 139 800 km, khối lượng gấp hơn 300 lần Trái Đất."],
["hanh tinh nho nhat","Hành tinh nhỏ nhất là Sao Thủy, đường kính khoảng 4 880 km, chỉ lớn hơn Mặt Trăng một chút."],
["hanh tinh nong nhat","Hành tinh nóng nhất là Sao Kim, khoảng 465°C, do hiệu ứng nhà kính của lớp khí quyển CO₂ rất dày."],
["hanh tinh lanh nhat","Hành tinh lạnh nhất là Sao Thiên Vương: nhiệt độ có thể xuống khoảng −224°C, thấp hơn cả Sao Hải Vương dù Hải Vương xa Mặt Trời hơn."],
["hanh tinh gan mat troi nhat","Hành tinh gần Mặt Trời nhất là Sao Thủy, cách khoảng 0,39 AU."],
["hanh tinh xa mat troi nhat","Hành tinh xa Mặt Trời nhất là Sao Hải Vương, cách khoảng 30,1 AU (gần 4,5 tỉ km)."],
["vanh dai kuiper|kuiper","Vành đai Kuiper là vùng chứa nhiều thiên thể băng nằm ngoài quỹ đạo Sao Hải Vương, từ khoảng 30 đến 50 AU. Diêm Vương là một thành viên của vùng này."],
["may oort|oort","Đám mây Oort là vùng giả thuyết hình cầu bao quanh Hệ Mặt Trời ở khoảng vài chục nghìn AU, được cho là nguồn của các sao chổi chu kỳ dài."],
["ngay va dem|tai sao co ngay va dem|ngay dem","Ngày và đêm do Trái Đất tự quay quanh trục, mất khoảng 24 giờ (chính xác hơn là 23 giờ 56 phút so với các sao). Nửa hướng về Mặt Trời là ban ngày, nửa còn lại là ban đêm."],
["ve tinh tu nhien|ve tinh la gi","Vệ tinh tự nhiên là thiên thể quay quanh một hành tinh. Trái Đất có 1 (Mặt Trăng), Sao Hỏa có 2 (Phobos, Deimos), còn Sao Mộc và Sao Thổ có số lượng rất lớn."],
["sao bang|thien thach|sao roi","Sao băng là vệt sáng khi một mảnh vật chất nhỏ (thiên thạch) lao vào khí quyển Trái Đất và bị nung nóng do ma sát. Mảnh nào rơi xuống được mặt đất gọi là thiên thạch."],
["vet den mat troi|vet den","Vết đen Mặt Trời là vùng trên bề mặt có nhiệt độ thấp hơn xung quanh (khoảng 3 800 K) nên trông tối hơn. Chúng liên quan đến từ trường mạnh và số lượng thay đổi theo chu kỳ khoảng 11 năm."],
["gio mat troi|cuc quang","Gió Mặt Trời là dòng hạt tích điện từ Mặt Trời thổi ra không gian. Khi chúng đi vào khí quyển ở gần hai cực từ của Trái Đất sẽ gây ra cực quang."],
["vet do lon|vet do sao moc","Vết Đỏ Lớn là một cơn bão khổng lồ trên Sao Mộc, rộng hơn Trái Đất, đã được quan sát từ hơn 300 năm nay."],

function advancedAnswer(q){

 ADV.forEach(function(item){
  item[0].split("|").forEach(function(phrase){
   var words=phrase.split(/\s+/).filter(Boolean),matched=0;
   words.forEach(function(w){if(q.indexOf(" "+w+" ")>=0)matched++});
   var coverage=matched/Math.max(words.length,1);
   var score=matched>=2?coverage*100+Math.min(words.length,12):0;
   // Cụm chính xác được ưu tiên; câu diễn đạt lại vẫn có thể khớp.
   if(q.indexOf(" "+phrase+" ")>=0)score+=35;
   if(score>best){best=score;result=item[1]}
  });
 });
 return best>=67?result:null;
}

function answer(raw){
 var n=norm(raw),q=pad(n),m;
 var adv=advancedAnswer(q);if(adv)return adv;
 var circ=circular(raw);if(circ)return circ;
 m=n.match(/(\d+(?:[.,]\d+)?)\s*(?:au|dvtv|don vi thien van)\b/);
 if(m){var a=parseFloat(m[1].replace(",","."));
  if(a>0)return "Theo định luật Kepler 3, T² = a³. Với a = "+fmt(a)+" AU thì T = √("+fmt(a)+"³) = "+fmt(Math.sqrt(a*a*a))+" năm."}
 var pl=null,pb=0;
 P.forEach(function(p){var s=hit(q,p.k);if(s>pb){pb=s;pl=p}});
 if(pl){
  var at=null,ab=0;
  ATTR.forEach(function(x){var s=hit(q,x[1]);if(s>ab){ab=s;at=x[0]}});
  var n2=pl.n;
  switch(at){
   case "dist":return n2+" cách Mặt Trời khoảng "+pl.a+" AU, tức "+pl.d+" triệu km.";
   case "dia":return "Đường kính của "+n2+" khoảng "+pl.dia+" km.";
   case "T":return "Chu kỳ quay quanh Mặt Trời của "+n2+" là "+pl.T+".";
   case "rot":return "Chu kỳ tự quay của "+n2+" là "+pl.rot+".";
   case "moons":return n2+" có "+pl.m+".";
   case "temp":return "Nhiệt độ của "+n2+": "+pl.t+".";
   case "mass":return "Khối lượng của "+n2+" khoảng "+pl.M+" kg.";
  }
  return n2+": cách Mặt Trời "+pl.a+" AU ("+pl.d+" triệu km); đường kính "+pl.dia+" km; chu kỳ quỹ đạo "+pl.T+"; tự quay "+pl.rot+"; "+pl.m+"; nhiệt độ "+pl.t+"; khối lượng "+pl.M+" kg."
 }
 var g=null,gb=0;
 G.forEach(function(x){var s=hit(q,x[0]);if(s>gb){gb=s;g=x[1]}});
 if(g)return g;
 return "Mình chưa có thông tin về câu hỏi này. Bạn thử hỏi về: một hành tinh (khoảng cách, đường kính, chu kỳ…), định luật Kepler, lực hấp dẫn, vận tốc vũ trụ, thủy triều, nhật thực, các mùa…"
}

/* ---------- KHUÔN MẶT ---------- */
var el={bl:$("bl"),br:$("br"),pl:$("pl"),pr:$("pr"),ll:$("ll"),lr:$("lr"),mo:$("mo")};
var speaking=false,mouth=0,mTarget=0,mNext=0,blinkAt=2500,blinkStart=-1,gx=0,gy=0,gtx=0,gty=0,gNext=0;
function setMouth(o){
 var u=244,l=244+o*36,w=36-o*4;
 el.mo.setAttribute("d","M"+(150-w-0)+" 236Q150 "+u+" "+(150+w)+" 236Q150 "+l+" "+(150-w)+" 236Z");
}
function frame(ts){
 if(ts>blinkAt&&blinkStart<0){blinkStart=ts}
 var lid=0;
 if(blinkStart>=0){var p=(ts-blinkStart)/180;if(p>=1){blinkStart=-1;blinkAt=ts+2000+Math.random()*3500}else lid=1-Math.abs(2*p-1)}
 el.ll.setAttribute("height",(lid*32).toFixed(1));el.lr.setAttribute("height",(lid*32).toFixed(1));
 if(ts>gNext){gtx=(Math.random()-.5)*10;gty=(Math.random()-.5)*5;gNext=ts+1200+Math.random()*2200}
 gx+=(gtx-gx)*.12;gy+=(gty-gy)*.12;
 var t="translate("+gx.toFixed(1)+" "+gy.toFixed(1)+")";
 el.pl.setAttribute("transform",t);el.pr.setAttribute("transform",t);
 if(speaking){if(ts>mNext){mTarget=Math.random()>.3?.35+Math.random()*.65:.08;mNext=ts+90+Math.random()*70}}else mTarget=0;
 mouth+=(mTarget-mouth)*.35;setMouth(mouth);
 var br=speaking?-3*Math.pow(Math.sin(ts/380),2):0;
 el.bl.setAttribute("transform","translate(0 "+br.toFixed(1)+")");el.br.setAttribute("transform","translate(0 "+br.toFixed(1)+")");
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- GIỌNG ĐỌC ---------- */
var synth=window.speechSynthesis,voices=[],muted=false,vsel=$("vsel"),fake=0;
function maleName(v){var n=v.name;return /namminh|\bnam\b|\bminh\b|\bmale\b|hung|\bduc\b|giang|\bson\b/i.test(n)&&!/female|hoai|\bmy\b|linh|\bmai\b/i.test(n)}
var picked=false,hasMale=false;
function loadVoices(){
 if(!synth)return;
 var all=synth.getVoices(),vi=all.filter(function(v){return /^vi/i.test(v.lang)});
 voices=vi.length?vi:all;
 var cur=picked?vsel.value:"";vsel.innerHTML="";
 voices.forEach(function(v,i){var o=document.createElement("option");o.value=i;o.textContent=v.name+(maleName(v)?" (nam)":"");vsel.appendChild(o)});
 if(!voices.length){var o=document.createElement("option");o.textContent="Giọng mặc định";vsel.appendChild(o);return}
 var pick=-1;voices.forEach(function(v,i){if(pick<0&&maleName(v))pick=i});hasMale=pick>=0;
 vsel.value=cur!==""&&voices[cur]?cur:(pick>=0?pick:0);
}
loadVoices();if(synth)synth.onvoiceschanged=loadVoices;
vsel.onchange=function(){picked=true};
function spoken(s){
 return s.replace(/\((?:cười|cuoi)\)/gi,"ha ha ha, ").replace(/×10([⁻⁰-⁹]+)/g,function(_,e){return " nhân 10 mũ "+e.split("").map(function(c){return c==="⁻"?"âm ":"⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)}).join("")})
  .replace(/²/g," bình phương").replace(/³/g," lập phương").replace(/₁/g," 1").replace(/₂/g," 2")
  .replace(/√/g,"căn ").replace(/−/g,"âm ").replace(/°C/g," độ C").replace(/\bAU\b/g,"đơn vị thiên văn")
  .replace(/\bkm\/s\b/g,"ki-lô-mét trên giây").replace(/\bkm\b/g,"ki-lô-mét").replace(/\bkg\b/g,"ki-lô-gam")
  .replace(/\bK\b/g," ken-vin").replace(/×/g," nhân ").replace(/√/g," căn ").replace(/\brad\/s\b/g," ra-đi-an trên giây").replace(/\bm\/s\b/g," mét trên giây").replace(/\bHz\b/g," héc").replace(/(\d)\s*m(?=[\s.,;:!?)]|$)/g,"$1 mét").replace(/(\d)\s*s(?=[\s.,;:!?)]|$)/g,"$1 giây").replace(/π/g," pi ").replace(/ω/g," ô-mê-ga ").replace(/≈/g," xấp xỉ ").replace(/=/g," bằng ").replace(/\//g," chia ").replace(/\n/g,". ");
}
var tok=0;
function speak(text){
 clearTimeout(fake);var my=++tok;
 if(synth)synth.cancel();
 if(muted||!synth){speaking=false;return}
 // Phát một utterance duy nhất để tránh lỗi hàng đợi khi câu trả lời
 // có nhiều câu/đoạn. Không phát đồng thời nhiều utterance.
 speaking=true;
 setTimeout(function(){
  if(my!==tok||muted)return;
  try{
   if(!voices.length)loadVoices();
   var u=new SpeechSynthesisUtterance(spoken(text));
   var idx=parseInt(vsel.value,10),v=voices[idx];
   u.lang=(v&&v.lang)||"vi-VN";
   if(v)u.voice=v;
   u.rate=parseFloat($("rate").value)||1;
   u.pitch=(v&&maleName(v))?1:.55;if(!(v&&maleName(v)))u.rate=Math.max(.7,u.rate*.92);
   u.onstart=function(){if(my===tok)speaking=true};
   u.onend=function(){if(my===tok)speaking=false};
   u.onerror=function(){if(my===tok)speaking=false};
   synth.speak(u);
  }catch(e){speaking=false;}
 },120);
}

/* ---------- GIAO DIỆN ---------- */
function ask(text){
 text=(text||"").trim();if(!text)return;
 $("you").textContent="Bạn hỏi: "+text;
 var r;try{r=answer(text)}catch(e){r="Lỗi khi xử lý: "+e.message}
 ans.className="";
 if(/\((?:cười|cuoi)\)/i.test(r)&&synth&&!muted){ans.textContent="🔊 Kiệt đang trả lời bằng giọng nói…";speak(r)}
 else{ans.textContent=r.replace(/\((?:cười|cuoi)\)\s*/gi,"");speak(r)}
}
$("go").onclick=function(){ask($("q").value);$("q").value=""};
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"){ask(this.value);this.value=""}});
$("mute").onclick=function(){
 muted=!muted;this.textContent=muted?"🔇 Âm thanh: tắt":"🔊 Âm thanh: bật";this.setAttribute("aria-pressed",muted);
 if(muted&&synth){synth.cancel();speaking=false}
};
CHIPS.forEach(function(c){var b=document.createElement("button");b.textContent=c;b.onclick=function(){ask(c)};$("chips").appendChild(b)});

var SRc=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$("mic"),listening=false,errShown=false;
function say(m){ans.className="";ans.textContent=m}
if(!SRc){mic.disabled=true;mic.title="Trình duyệt này không hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge, hoặc gõ chữ.";
 say("Trình duyệt này không hỗ trợ hỏi bằng giọng nói. Hãy mở bằng Chrome hoặc Edge (Firefox và Safari không hỗ trợ), hoặc gõ câu hỏi vào ô chữ.")}
else{
 var rec=new SRc(),finalTx="";
 rec.lang="vi-VN";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
 rec.onstart=function(){listening=true;errShown=false;finalTx="";mic.classList.add("on");$("you").textContent="🎤 Đang nghe… hãy nói câu hỏi"};
 rec.onresult=function(e){
  var it="";
  for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)finalTx+=r[0].transcript;else it+=r[0].transcript}
  $("you").textContent="🎤 "+(finalTx+it);
 };
 rec.onend=function(){
  listening=false;mic.classList.remove("on");
  var t=finalTx.trim();finalTx="";
  if(t)ask(t);else if(!errShown)say("Mình chưa nghe rõ. Bạn bấm 🎤 và nói lại nhé.");
 };
 rec.onerror=function(e){
  if(e.error==="aborted")return;
  errShown=true;
  var m={
   "not-allowed":"Trình duyệt đang chặn micro. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ → cho phép Micro rồi bấm 🎤 lại."+(location.protocol==="file:"?" Bạn đang mở file trực tiếp từ máy; nên mở qua GitHub Pages (https) hoặc localhost để micro hoạt động ổn định.":""),
   "service-not-allowed":"Trình duyệt không cho dùng nhận giọng nói ở trang này. Hãy mở qua https (GitHub Pages) hoặc localhost.",
   "audio-capture":"Không tìm thấy micro. Hãy kiểm tra micro đã cắm và chọn đúng trong cài đặt hệ thống.",
   "no-speech":"Mình không nghe thấy tiếng nói. Bạn bấm 🎤 và nói lại nhé.",
   "network":"Nhận giọng nói của Chrome và Edge cần kết nối Internet. Hãy kiểm tra mạng rồi thử lại.",
   "language-not-supported":"Trình duyệt không hỗ trợ tiếng Việt cho nhận giọng nói."
  }[e.error]||("Lỗi micro: "+e.error);
  say(m);
 };
 mic.onclick=function(){
  if(listening){rec.stop();return}
  if(synth)synth.cancel();speaking=false;tok++;
  try{rec.start()}catch(err){say("Không bật được micro: "+err.message)}
 };
}

ans.className="";
var hello="Chào bạn, mình là Kiệt. Hãy hỏi mình về Hệ Mặt Trời nhé: hành tinh, định luật Kepler, lực hấp dẫn…";
ans.textContent=hello;
}catch(e){showErr(e.message)}
})();
